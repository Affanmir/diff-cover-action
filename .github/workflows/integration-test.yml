name: Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test-coverage-mode:
    name: Test Coverage Mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and run tests with coverage
        run: |
          pip install -r requirements-dev.txt
          pytest tests/ --cov=src --cov-report=xml

      - name: Run diff-cover-action (coverage mode)
        uses: ./
        with:
          mode: coverage
          coverage-files: coverage.xml
          compare-branch: origin/main
          fail-under: '0'
          post-comment: 'true'
          create-annotations: 'true'
          create-badge: 'true'

      # A missing report silently becomes an empty 100% result, so check the files directly
      - name: Assert all reports were written
        run: |
          for f in /tmp/dc-report.json /tmp/dc-report.md /tmp/dc-report.html; do
            test -s "$f" || { echo "::error::$f was not written"; exit 1; }
          done

  test-quality-mode:
    name: Test Quality Mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # diff-quality needs the linter itself; without it no JSON report is written
      - name: Install ruff
        run: pip install ruff

      - name: Run diff-cover-action (quality mode)
        uses: ./
        with:
          mode: quality
          violations: 'ruff.check'
          compare-branch: origin/main
          fail-under: '0'
          post-comment: 'false'
          create-annotations: 'false'

      - name: Assert all reports were written
        run: |
          for f in /tmp/dc-report.json /tmp/dc-report.md /tmp/dc-report.html; do
            test -s "$f" || { echo "::error::$f was not written"; exit 1; }
          done
